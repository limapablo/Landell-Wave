name: Build radio catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - ".github/workflows/build-and-deploy.yml"

permissions:
  contents: read

concurrency:
  group: radio-catalog-build
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build worldwide catalog
        run: python src/build_catalog.py --output public --cache .cache --clean-generated

      - name: Add build metadata
        run: printf '%s\n' "${GITHUB_SHA}" > public/build.txt

      - name: Publish clean snapshot to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tmpdir="$(mktemp -d)"
          cp -a public/. "$tmpdir/"
          git checkout --orphan gh-pages-build
          git rm -rf . >/dev/null
          cp -a "$tmpdir/." .
          rm -rf "$tmpdir"
          git add -A
          git commit -m "chore: refresh worldwide radio catalog"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
