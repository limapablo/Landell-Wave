name: Build and publish radio catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "public/**"
      - ".github/workflows/build-and-deploy.yml"

permissions:
  contents: read

concurrency:
  group: radio-catalog-build
  cancel-in-progress: true

jobs:
  build:
    name: Build untrusted catalog
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run unit and negative tests
        run: python -m unittest discover -s tests -v

      - name: Compile-check Python
        run: python -m py_compile src/*.py

      - name: Build worldwide catalog
        run: python src/build_catalog.py --output public --cache .cache --clean-generated

      - name: Validate generated artifact
        run: python src/validate_output.py public

      - name: Add build metadata
        run: printf '%s\n' "${GITHUB_SHA}" > public/build.txt

      - name: Upload immutable build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: global-web-radio-site
          path: public/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

  publish:
    name: Publish verified snapshot
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository metadata only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download verified build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: global-web-radio-site
          path: site

      - name: Verify publish artifact shape
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/data/index.json
          test -f site/playlists/world.m3u
          test ! -L site
          if find site -type l -print -quit | grep -q .; then
            echo "Symlinks are forbidden in publish artifacts" >&2
            exit 1
          fi

      - name: Publish orphan gh-pages snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cp -a site/. "$tmpdir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-build
          git rm -rf . >/dev/null
          cp -a "$tmpdir/." .
          rm -rf "$tmpdir"

          git add -A
          git commit -m "chore: refresh worldwide radio catalog"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
