name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static policy analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Security policy lint
        run: python src/security_lint.py

      - name: Negative and unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile-check Python
        run: python -m py_compile src/*.py

  codeql:
    name: CodeQL
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify JavaScript source is analyzable
        if: matrix.language == 'javascript-typescript'
        shell: bash
        run: |
          set -euo pipefail
          test -s public/assets/app.js
          test "$(wc -l < public/assets/app.js)" -ge 20 || {
            echo "public/assets/app.js appears empty or minified into too few lines; CodeQL may classify it as generated." >&2
            exit 1
          }

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@e12f0178983d466f2f6028f5cc7a6d786fd97f4b # v4.31.4
